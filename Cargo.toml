[package]
name = "microstrain-inertial"
authors = ["Jeff McBride <jeff@jeffmcbride.net>"]
description = "Library for communicating with Microstrain IMUs via MIP protocol"
keywords = ["no_std", "embedded", "parser"]
categories = ["embedded", "no-std", "no-std::no-alloc"]

version = "0.0.1"
edition = "2024"

[dependencies]
bbqueue = { version = "0.6.0", default-features = false, features = ["critical-section"] }
critical-section = "1.2.0"
log = "0.4.29"
serial2 = { version = "0.2.34", optional = true }
thiserror = "2.0.17"

[dev-dependencies]
clap = { version = "4.5.58", features = ["derive"] }
critical-section = { version = "1.2.0", features = ["std"] }
serialport = "4.8.1"
tokio = { version = "1.49.0", features = ["macros", "rt"] }

[features]
default = ["serialport", "std"]
std = []
serialport = [ "std", "dep:serial2" ]
